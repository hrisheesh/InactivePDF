<!doctype html><html><head><meta charset="utf-8"><title>InactivePDF Profiles</title><style>
body{font:16px system-ui;margin:0;background:#f3f4f6;color:#17202a}main{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{background:#17202a;color:white;padding:24px}section{padding:32px;max-width:1100px}button,input,select{font:inherit;padding:10px;margin:5px 0}button{cursor:pointer}.preview{width:420px;height:594px;background:white;border:1px solid #ccd;position:relative;display:grid;place-items:center;margin-top:20px;overflow:hidden}.watermark{font-size:42px;color:#808080;opacity:.2;transform:rotate(-35deg);white-space:nowrap}.row{display:flex;gap:24px;flex-wrap:wrap}.field{display:flex;flex-direction:column;min-width:190px}ul{padding:0;list-style:none}li{padding:10px;background:#263746;margin:5px 0;cursor:pointer}
</style></head><body><main><aside><h2>InactivePDF</h2><p>Watermark profiles</p><ul id="profiles"></ul><button onclick="newProfile()">New profile</button></aside><section><h1 id="title">New profile</h1><div class="row"><div><div class="field">Profile name<input id="name" value="default"></div><div class="field">Text<input id="text" value="CONFIDENTIAL"></div><div class="field">Font size<input id="size" type="number" value="42"></div><div class="field">Opacity<input id="opacity" type="range" min="0" max="1" step=".01" value=".2"></div><div class="field">Rotation<input id="rotation" type="number" value="-35"></div><div class="field">Position<select id="position"><option>Center</option><option>TopLeft</option><option>TopRight</option><option>BottomLeft</option><option>BottomRight</option></select></div><button onclick="save()">Save profile</button></div><div><div class="preview"><div id="wm" class="watermark">CONFIDENTIAL</div></div><p>Live first-page preview</p></div></div><pre id="message"></pre><script>
const $=id=>document.getElementById(id);function update(){let w=$('wm');w.textContent=$('text').value;w.style.fontSize=$('size').value+'px';w.style.opacity=$('opacity').value;w.style.transform=`rotate(${$('rotation').value}deg)`}document.querySelectorAll('input,select').forEach(x=>x.oninput=update);async function load(){let r=await fetch('/v1/watermark-profiles');let p=await r.json();$('profiles').innerHTML=Object.keys(p).map(n=>`<li onclick="selectProfile('${n}')">${n}</li>`).join('')}async function selectProfile(n){let p=await (await fetch('/v1/watermark-profiles/'+encodeURIComponent(n))).json();$('name').value=n;$('text').value=p.text||'';$('size').value=p.fontSize||42;$('opacity').value=p.opacity??.2;$('rotation').value=p.rotation||0;$('position').value=p.position||'Center';update()}function newProfile(){$('name').value='new-profile';$('text').value='CONFIDENTIAL';update()}async function save(){let p={kind:'Text',text:$('text').value,fontSize:+$('size').value,opacity:+$('opacity').value,rotation:+$('rotation').value,position:$('position').value,pages:'all',layer:'Over'};let r=await fetch('/v1/watermark-profiles/'+encodeURIComponent($('name').value),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});$('message').textContent=r.ok?'Saved':'Save failed';load()}update();load();</script></section></main></body></html>
