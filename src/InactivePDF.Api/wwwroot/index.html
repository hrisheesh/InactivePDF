<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InactivePDF Watermark Editor</title><style>
:root{font:15px system-ui;color:#17202a;background:#eef1f5}*{box-sizing:border-box}body{margin:0}main{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}aside{background:#17202a;color:#fff;padding:24px}section{padding:28px;max-width:1200px}.brand{font-size:22px;font-weight:700}.muted{color:#a9b6c2}.profiles{padding:0;margin:20px 0;list-style:none}.profiles li{display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:7px;margin:5px 0;cursor:pointer}.profiles li:hover{background:#2b4355}.profiles button{background:transparent;color:#fff;border:0;cursor:pointer}.layout{display:grid;grid-template-columns:minmax(280px,430px) minmax(360px,1fr);gap:28px}.card{background:#fff;border:1px solid #d9e0e7;border-radius:12px;padding:20px;box-shadow:0 2px 8px #17202a12}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.full{grid-column:1/-1}input,select,button{font:inherit;padding:9px;border:1px solid #bac6d1;border-radius:6px;background:#fff}button.primary{background:#1769aa;color:#fff;border-color:#1769aa;cursor:pointer}.actions{display:flex;gap:8px;margin-top:16px}.preview-wrap{display:flex;justify-content:center;padding:18px;background:#f5f7fa;border-radius:8px}.page{width:min(100%,480px);aspect-ratio:8.27/11.69;background:#fff;border:1px solid #cdd5dd;position:relative;overflow:hidden;box-shadow:0 2px 10px #17202a18}.wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-35deg);font-size:42px;color:#808080;opacity:.2;white-space:nowrap}.header,.footer{position:absolute;left:12px;right:12px;text-align:center;color:#808080;font-size:12px;opacity:.2}.header{top:8px}.footer{bottom:8px}.hint{font-size:13px;color:#5c6b78}#message{min-height:22px;color:#1769aa}
</style></head><body><main><aside><div class="brand">InactivePDF</div><p class="muted">Watermark profile editor</p><ul id="profiles" class="profiles"></ul><button onclick="newProfile()">＋ New profile</button></aside><section><h1 id="title">New watermark profile</h1><div class="layout"><div class="card"><div class="grid"><label class="field">Profile name<input id="name" value="default" maxlength="64"></label><label class="field">Type<select id="kind"><option>Text</option><option>Image</option></select></label><label class="field full" id="textField">Watermark text<input id="text" value="CONFIDENTIAL"></label><label class="field full" id="imageField" hidden>Asset filename<input id="imagePath" placeholder="logo.png"><span class="hint">Use a file in the configured watermark-assets directory.</span></label><label class="field">Font family<input id="fontFamily" value="Arial"></label><label class="field">Font size<input id="size" type="number" min="1" max="500" value="42"></label><label class="field">Color<input id="color" type="color" value="#808080"></label><label class="field">Opacity<input id="opacity" type="number" min="0" max="1" step=".01" value=".2"></label><label class="field">Rotation<input id="rotation" type="number" min="-360" max="360" value="-35"></label><label class="field">Position<select id="position"><option>TopLeft</option><option>TopCenter</option><option>TopRight</option><option>CenterLeft</option><option selected>Center</option><option>CenterRight</option><option>BottomLeft</option><option>BottomCenter</option><option>BottomRight</option></select></label><label class="field">Layer<select id="layer"><option>Over</option><option>Behind</option></select></label><label class="field">Pages<input id="pages" value="all" placeholder="all, 1,3-5, odd"></label><label class="field">Width (pt)<input id="width" type="number" min="1" max="2000"></label><label class="field">Height (pt)<input id="height" type="number" min="1" max="2000"></label><label class="field full"><span><input id="tile" type="checkbox"> Tile selected pages</span></label><label class="field full">Header<input id="header" placeholder="Company — {page}/{pages}"></label><label class="field full">Footer<input id="footer" placeholder="Confidential"></label></div><div class="actions"><button class="primary" onclick="save()">Save profile</button><button onclick="removeProfile()">Delete</button></div><p id="message" role="status"></p></div><div class="card"><h2>Live preview</h2><div class="preview-wrap"><div class="page"><div id="previewHeader" class="header"></div><div id="wm" class="wm">CONFIDENTIAL</div><div id="previewFooter" class="footer"></div></div></div><p class="hint">Preview uses the current settings. Inspect a rendered PDF before production use.</p></div></div></section></main>
<script>const $=id=>document.getElementById(id),ids=['kind','name','text','imagePath','fontFamily','size','color','opacity','rotation','position','layer','pages','width','height','tile','header','footer'];function update(){let image=$('kind').value==='Image';$('textField').hidden=image;$('imageField').hidden=!image;let w=$('wm');w.textContent=image?($('imagePath').value||'IMAGE'):$('text').value;w.style.fontFamily=$('fontFamily').value;w.style.fontSize=Math.max(8,+$('size').value||42)+'px';w.style.color=$('color').value;w.style.opacity=$('opacity').value;w.style.transform=`translate(-50%,-50%) rotate(${$('rotation').value}deg)`;$('previewHeader').textContent=$('header').value.replace('{page}','1').replace('{pages}','1');$('previewFooter').textContent=$('footer').value.replace('{page}','1').replace('{pages}','1')}function value(){let n=v=>v===''?null:+v;return{kind:$('kind').value,text:$('text').value,imagePath:$('imagePath').value||null,fontFamily:$('fontFamily').value,fontSize:+$('size').value,color:$('color').value,opacity:+$('opacity').value,rotation:+$('rotation').value,position:$('position').value,layer:$('layer').value,pages:$('pages').value,tile:$('tile').checked,width:n($('width').value),height:n($('height').value),header:$('header').value||null,footer:$('footer').value||null}}function fill(n,p){$('name').value=n;ids.forEach(id=>{if(p[id]!==undefined&&p[id]!==null){let e=$(id);if(e.type==='checkbox')e.checked=!!p[id];else e.value=p[id]}});$('title').textContent=n;update()}async function load(){let r=await fetch('/v1/watermark-profiles');if(!r.ok){$('message').textContent='Authentication or server connection required';return}let p=await r.json(),list=$('profiles');list.replaceChildren();Object.keys(p).sort().forEach(n=>{let li=document.createElement('li'),b=document.createElement('button');li.append(document.createTextNode(n));b.textContent='Edit';b.onclick=()=>selectProfile(n);li.append(b);list.append(li)})}async function selectProfile(n){let r=await fetch('/v1/watermark-profiles/'+encodeURIComponent(n));if(r.ok)fill(n,await r.json())}function newProfile(){fill('new-profile',{kind:'Text',text:'CONFIDENTIAL',fontSize:42,color:'#808080',opacity:.2,rotation:-35,position:'Center',layer:'Over',pages:'all',tile:false})}async function save(){let n=$('name').value.trim(),r=await fetch('/v1/watermark-profiles/'+encodeURIComponent(n),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(value())});$('message').textContent=r.ok?'Saved successfully':(await r.text()||'Save failed');if(r.ok)load()}async function removeProfile(){let n=$('name').value.trim();if(!n)return;let r=await fetch('/v1/watermark-profiles/'+encodeURIComponent(n),{method:'DELETE'});$('message').textContent=r.ok?'Deleted':'Delete failed';if(r.ok){newProfile();load()}}ids.forEach(id=>$(id).addEventListener('input',update));update();load();</script></body></html>
