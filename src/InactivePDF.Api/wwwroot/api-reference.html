<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>InactivePDF API reference</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#252936;background:#f4f5f8}*{box-sizing:border-box}body{margin:0}.shell{max-width:1320px;margin:0 auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:28px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#868b9a}.top h1{font-size:34px;letter-spacing:-.05em;margin:8px 0}.top p{color:#777d8c;margin:0}.links{display:flex;gap:10px;flex-wrap:wrap}.link,button{font:inherit;border:1px solid #dfe2e9;border-radius:12px;background:#fff;color:#555c6b;padding:10px 14px;text-decoration:none;cursor:pointer}.link:hover,button:hover{background:#eef0f5}.auth{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid #e3e6ec;border-radius:18px;padding:14px;margin-bottom:20px;box-shadow:0 5px 20px #31384708}.auth label{font-size:11px;color:#7f8592;white-space:nowrap}.auth input{flex:1;border:0;background:#f1f2f6;border-radius:10px;padding:11px;min-width:160px;outline:0}.layout{display:grid;grid-template-columns:320px 1fr;gap:20px}.card{background:#fff;border:1px solid #e4e7ed;border-radius:20px;box-shadow:0 8px 30px #3138470b}.catalog{padding:16px;align-self:start;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto}.catalog input{width:100%;border:1px solid #e2e5ec;border-radius:10px;padding:11px;margin-bottom:12px}.endpoint{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;border-radius:10px;background:transparent;padding:10px;font-size:11px}.endpoint.active,.endpoint:hover{background:#f0f1f6}.method{font-size:9px;font-weight:700;min-width:44px;text-align:center;border-radius:5px;padding:5px;background:#e9edf7;color:#586c9b}.method.post{background:#fff0e7;color:#bd745b}.method.delete{background:#ffebef;color:#b75d70}.method.put{background:#e9f4eb;color:#5b906d}.path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#535a69}.detail{padding:28px}.detail h2{font-size:24px;letter-spacing:-.04em;margin:0 0 8px}.detail p{color:#7c8290;line-height:1.6}.pill{display:inline-block;border-radius:999px;background:#eef0f5;color:#747b89;padding:5px 9px;font-size:10px;margin:4px 4px 0 0}.route{display:flex;align-items:center;gap:10px;margin:20px 0 18px}.route code{font-size:16px;color:#313745;overflow-wrap:anywhere}.section{border-top:1px solid #eceef2;padding-top:20px;margin-top:22px}.section h3{font-size:13px;margin:0 0 12px}.try{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.parameter{display:flex;align-items:center;gap:12px;margin:8px 0;color:#697080;font-size:12px}.parameter span{min-width:150px}.parameter input{flex:1;max-width:420px;border:1px solid #e2e5ec;border-radius:10px;padding:10px;font:inherit;outline:0}.parameter input:focus{border-color:#919ae8;box-shadow:0 0 0 3px #919ae822}.response{background:#1f2430;color:#dce2ef;border-radius:12px;padding:16px;min-height:80px;white-space:pre-wrap;overflow:auto;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.hint{font-size:11px;color:#959ba8}.state{font-size:12px;color:#727988;padding:12px}.error{color:#b7615e}@media(max-width:850px){.shell{padding:18px}.top{display:block}.links{margin-top:16px}.layout{grid-template-columns:1fr}.catalog{position:static;max-height:320px}.auth{align-items:stretch;flex-direction:column}.auth label{white-space:normal}.parameter{display:block}.parameter span{display:block;margin-bottom:5px}.parameter input{max-width:none;width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div><div class="eyebrow">InactivePDF · developer tools</div><h1>API reference</h1><p>Conversion, durable jobs, profiles, and administration for your private server.</p></div><nav class="links"><a class="link" href="/">Operations console</a><a class="link" href="/openapi.json" target="_blank" rel="noreferrer">OpenAPI JSON</a></nav></header>
    <section class="auth"><label for="token">Bearer token</label><input id="token" type="password" autocomplete="off" placeholder="Optional for health; required for protected endpoints"><button id="clearToken" type="button">Clear</button><span class="hint">Kept in this tab only.</span></section>
    <div class="layout"><aside class="card catalog"><input id="filter" type="search" placeholder="Filter endpoints"><div id="endpointList" class="state">Loading reference…</div></aside><section class="card detail" id="detail"><div class="state">Choose an endpoint.</div></section></div>
  </main>
  <script>
    const $=id=>document.getElementById(id), state={doc:null,items:[],selected:null};
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const tokenKey='inactivepdf-api-reference-token';
    $('token').value=sessionStorage.getItem(tokenKey)||'';
    $('token').oninput=()=>sessionStorage.setItem(tokenKey,$('token').value);
    $('clearToken').onclick=()=>{sessionStorage.removeItem(tokenKey);$('token').value='';};
    async function load(){try{state.doc=await (await fetch('/openapi.json',{cache:'no-store'})).json();state.items=Object.entries(state.doc.paths).flatMap(([path,methods])=>Object.entries(methods).map(([method,operation])=>({path,method,operation})));renderList();select(state.items[0]);}catch(e){$('endpointList').innerHTML='<div class="state error">The API reference could not load its OpenAPI document.</div>';}}
    function renderList(){const q=$('filter').value.trim().toLowerCase();const items=state.items.filter(x=>(x.path+' '+x.method+' '+(x.operation.summary||'')).toLowerCase().includes(q));$('endpointList').innerHTML=items.length?items.map((x,i)=>`<button class="endpoint ${state.selected===x?'active':''}" data-index="${state.items.indexOf(x)}"><span class="method ${x.method}">${x.method.toUpperCase()}</span><span class="path">${esc(x.path)}</span></button>`).join(''):'<div class="state">No matching endpoints.</div>';document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>select(state.items[Number(b.dataset.index)]));}
    const resolveParameter=p=>p.$ref?state.doc.components.parameters[p.$ref.split('/').pop()]:p;
    function select(item){if(!item)return;state.selected=item;renderList();const o=item.operation||{};const security=o.security?.length?'Protected endpoint':'Public endpoint';const parameters=(o.parameters||[]).map(resolveParameter);$('detail').innerHTML=`<div class="eyebrow">${esc(o.tags?.[0]||'API')}</div><div class="route"><span class="method ${item.method}">${item.method.toUpperCase()}</span><code>${esc(item.path)}</code></div><h2>${esc(o.summary||'Endpoint')}</h2><p>${esc(o.description||'')}</p><span class="pill">${security}</span>${parameters.map(p=>`<span class="pill">${esc(p.in)} · ${esc(p.name)}${p.required?' · required':''}</span>`).join('')}<div class="section"><h3>Parameters</h3>${parameters.length?parameters.map(p=>`<label class="parameter"><span>${esc(p.name)}${p.required?' *':''}</span><input data-param-in="${esc(p.in)}" data-param-name="${esc(p.name)}" placeholder="${esc(p.schema?.example??p.schema?.default??(p.required?'Required':'Optional'))}"></label>`).join(''):'<span class="hint">This request has no path or query parameters.</span>'}</div><div class="section"><h3>Try this request</h3><div class="try"><button id="tryRequest" type="button">Send ${item.method.toUpperCase()} request</button><span class="hint">GET and HEAD requests run directly from this page. Use the examples for multipart and state-changing requests.</span></div><pre class="response" id="response">No request sent.</pre></div><div class="section"><h3>Response codes</h3><div>${Object.entries(o.responses||{}).map(([code,r])=>`<span class="pill">${esc(code)} · ${esc(r.description||'')}</span>`).join('')}</div></div>`;if($('tryRequest'))$('tryRequest').onclick=()=>tryRequest(item,parameters);}
    async function tryRequest(item,parameters){const out=$('response');out.textContent='Loading…';try{let path=item.path;const query=new URLSearchParams();for(const p of parameters){const input=document.querySelector(`[data-param-in="${CSS.escape(p.in)}"][data-param-name="${CSS.escape(p.name)}"]`);const value=input?.value.trim()||'';if(p.required&&!value){out.textContent=`Enter the required ${p.in} parameter: ${p.name}`;return;}if(!value)continue;if(p.in==='path')path=path.replace(`{${p.name}}`,encodeURIComponent(value));else if(p.in==='query')query.set(p.name,value);}const url=query.size?`${path}?${query}`:path;const headers={};if($('token').value)headers.Authorization='Bearer '+$('token').value;const response=await fetch(url,{method:item.method,headers,cache:'no-store'});const text=await response.text();let body=text;try{body=JSON.stringify(JSON.parse(text),null,2);}catch{}out.textContent=`HTTP ${response.status} ${response.statusText}\n\n${body}`;}catch(e){out.textContent='Request failed: '+e.message;}}
    $('filter').oninput=renderList;load();
  </script>
</body>
</html>
